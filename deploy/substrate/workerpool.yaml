apiVersion: v1
kind: Namespace
metadata:
  name: meridian
---
apiVersion: "ate.dev/v1"
kind: WorkerPool
metadata:
  name: meridian
  namespace: meridian
  labels:
    workload: meridian
spec:
  replicas: 2
  workerImage: "localhost:5001/ateworker-gvisor@sha256:ad6957f41bccaa8bb5f3eb5b34b7812babb862f1a3187a11578c21a7d799491c"
