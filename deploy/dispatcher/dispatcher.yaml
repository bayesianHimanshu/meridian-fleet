# The Meridian dispatcher (phase 4b step 2): namespace, identity, RBAC and Deployment.
# Generated by `meridian dispatcher render` from
# src/meridian/sandbox/dispatcher_deploy.py; do not edit by hand. The token Secret
# (meridian-dispatcher-token) is created by `meridian dispatcher token`, never committed.
apiVersion: v1
kind: Namespace
metadata:
  name: meridian-dispatch
  labels:
    workload: meridian-dispatcher
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
  namespace: meridian-dispatch
  labels:
    workload: meridian-dispatcher
---
apiVersion: "networking.k8s.io/v1"
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: meridian-dispatch
  labels:
    workload: meridian-dispatcher
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: Role
metadata:
  name: meridian-dispatcher-pool
  namespace: meridian
  labels:
    workload: meridian-dispatcher
rules:
  - apiGroups:
      - "ate.dev"
    resources:
      - workerpools
    resourceNames:
      - meridian
    verbs:
      - get
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: RoleBinding
metadata:
  name: meridian-dispatcher-pool
  namespace: meridian
  labels:
    workload: meridian-dispatcher
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: Role
  name: meridian-dispatcher-pool
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: meridian-dispatch
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: ClusterRole
metadata:
  name: meridian-dispatcher-trust
  labels:
    workload: meridian-dispatcher
rules:
  - apiGroups:
      - "certificates.k8s.io"
    resources:
      - clustertrustbundles
    verbs:
      - get
      - list
      - watch
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: ClusterRoleBinding
metadata:
  name: meridian-dispatcher-trust
  labels:
    workload: meridian-dispatcher
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: ClusterRole
  name: meridian-dispatcher-trust
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: meridian-dispatch
---
apiVersion: "apps/v1"
kind: Deployment
metadata:
  name: meridian-dispatcher
  namespace: meridian-dispatch
  labels:
    workload: meridian-dispatcher
  annotations:
    meridian.dev/kubectl-ate-sha256: 691b75bc619dab644a658b8f3324a2d3ea11024d55375bbd4884f390fd29fda0
spec:
  replicas: 1
  selector:
    matchLabels:
      workload: meridian-dispatcher
  template:
    metadata:
      labels:
        workload: meridian-dispatcher
    spec:
      serviceAccountName: dispatcher
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: "localhost:5001/meridian-dispatcher@sha256:72e8b3e1d62dad2fe6b457ceb8ccbbeb37e7c7cc1dfdab849bc28bea6db69218"
          args:
            - serve
            - --port
            - "8090"
            - --token-file
            - "/run/dispatcher/token"
            - --atespace
            - meridian
            - --api-endpoint
            - "api.ate-system.svc:443"
            - --ate-token-file
            - "/run/ate/token"
            - --router
            - "https://atenet-router.ate-system.svc:8444"
            - --router-cert
            - "/run/router-client/credential-bundle.pem"
            - --router-ca
            - "/run/router-client/router-ca.pem"
            - --pool
            - "meridian/meridian"
            - --actor-port
            - "8080"
            - --placement-wait
            - "120.0"
            - --request-timeout
            - "180.0"
          env:
            - name: "POD_IP"
              valueFrom:
                fieldRef:
                  fieldPath: "status.podIP"
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: token
              mountPath: "/run/dispatcher"
              readOnly: true
            - name: ate-token
              mountPath: "/run/ate"
              readOnly: true
            - name: router-client
              mountPath: "/run/router-client"
              readOnly: true
            - name: tmp
              mountPath: "/tmp"
      volumes:
        - name: token
          secret:
            secretName: meridian-dispatcher-token
            defaultMode: 288
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "api.ate-system.svc"
                  expirationSeconds: 3600
                  path: token
        - name: router-client
          projected:
            sources:
              - podCertificate:
                  signerName: "podidentity.podcert.ate.dev/identity"
                  keyType: ECDSAP256
                  credentialBundlePath: "credential-bundle.pem"
              - clusterTrustBundle:
                  signerName: "servicedns.podcert.ate.dev/identity"
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: "router-ca.pem"
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
