# Agent Substrate WorkerPool for meridian's actors (one actor per worker).
# Generated by `meridian substrate render` from
# src/meridian/sandbox/substrate_templates.py; do not edit by hand.
apiVersion: v1
kind: Namespace
metadata:
  name: meridian
---
apiVersion: "ate.dev/v1"
kind: WorkerPool
metadata:
  name: meridian
  namespace: meridian
  labels:
    workload: meridian
spec:
  replicas: 2
  workerImage: "ghcr.io/agent-substrate/substrate/ateworker-gvisor@sha256:f8987236c6256f58c4b2625e543b43f4ae4bdded6ee6821c03d966effb7c0f17"
  sandboxClasses:
    - name: gvisor
  template:
    nodeSelector:
      meridian.dev/pool: substrate
    tolerations:
      - key: "ate.dev/sandboxClass"
        operator: Equal
        value: gvisor
        effect: NoSchedule
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 512Mi
