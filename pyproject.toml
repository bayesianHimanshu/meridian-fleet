[project]
name = "meridian-fleet"
version = "0.1.0"
description = "Meridian Agent Fleet: clinical-trial oversight agents for Meridian Therapeutics (learning project)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "structlog",
]

[project.scripts]
meridian = "meridian.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "DTZ", "PT", "ANN"]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN401"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
