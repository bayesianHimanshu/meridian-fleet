[project]
name = "meridian-fleet"
version = "0.1.0"
description = "Meridian Agent Fleet: clinical-trial oversight agents for Meridian Therapeutics (learning project)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "structlog",
    "polars>=2.1.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "pyreadstat>=1.3.7",
    "httpx>=0.28.1",
]

[project.scripts]
meridian = "meridian.cli:app"
meridian-worker = "meridian.worker:entry"
meridian-narrator-worker = "meridian.narrator_worker:entry"

[dependency-groups]
# The Fleet API (meridian api serve). Host only: the agent image is exported with
# --no-default-groups, so neither package is in it.
api = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "scipy-stubs>=1.18.1.1",
]

[tool.uv]
default-groups = ["dev", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "DTZ", "PT", "ANN"]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN401"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers -m 'not slow and not openshell'"
# fastapi's TestClient (starlette) suggests httpx2; httpx is the dependency in use.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "slow: needs network and real CDISC pilot data; run with -m slow",
    "openshell: needs the openshell CLI, a gateway and the agent image; run with -m openshell",
]
