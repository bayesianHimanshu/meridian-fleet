# openshell-prover boundary local_model: the most any policy proved against it may
# allow. Generated by `meridian policy render` from
# src/meridian/sandbox/policies.py; do not edit by hand.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr/local/bin/python3.14
    - /usr/local/lib
    - /usr/lib/x86_64-linux-gnu
    - /opt/meridian
    - /usr/bin/bash
    - /usr/bin/cat
    - /usr/bin/mkdir
    - /usr/bin/tar
  read_write:
    - /tmp
    - /stage/lm
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  ollama:
    name: ollama
    endpoints:
      - host: '172.17.0.1'
        port: 11434
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /api/tags
          - allow:
              method: POST
              path: /api/chat
        allowed_ips:
          - '172.17.0.1/32'
    binaries:
      - path: /usr/local/bin/python3.14
