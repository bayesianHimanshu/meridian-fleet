# OpenShell policy for the portfolio_signal agent (zone portfolio_signal). Generated by
# `meridian policy render` from src/meridian/sandbox/policies.py; do not edit by
# hand. No provider is attached; the network rules below are all it has.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr/local/bin/python3.14
    - /usr/local/lib
    - /usr/lib/x86_64-linux-gnu
    - /opt/meridian
    - /usr/bin/bash
    - /usr/bin/cat
    - /usr/bin/mkdir
    - /usr/bin/tar
  read_write:
    - /tmp
    - /stage/meta
    - /stage/signal
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  openfda:
    name: openfda
    endpoints:
      - host: api.fda.gov
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /drug/event.json
          - allow:
              method: GET
              path: /drug/label.json
    binaries:
      - path: /usr/local/bin/python3.14
