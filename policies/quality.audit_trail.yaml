# OpenShell policy for the quality.audit_trail agent (zone quality). Generated by
# `meridian policy render` from src/meridian/sandbox/policies.py; do not edit by
# hand. No provider is attached and the policy has no network rule.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr/local/bin/python3.14
    - /usr/local/lib
    - /usr/lib/x86_64-linux-gnu
    - /opt/meridian
    - /usr/bin/bash
    - /usr/bin/cat
    - /usr/bin/mkdir
    - /usr/bin/tar
  read_write:
    - /tmp
    - /stage/meta
    - /stage/audit
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
