# Meridian Agent Fleet default configuration.
# Every key can be overridden by an environment variable prefixed MERIDIAN_,
# for example MERIDIAN_LEDGER_PATH=/tmp/ledger.sqlite3.

ledger_path = "var/ledger.sqlite3"
default_seed = 20261107

study_id = "MRD-201"
raw_dir = "data/raw/cdisc_pilot"
curated_root = "data/curated"
sites_file = "config/sites.toml"
ground_truth_dir = "data/ground_truth"
safety_root = "data/safety_db"  # the synthetic safety database, one snapshot per cut
etmf_root = "data/etmf"  # the synthetic eTMF index, one snapshot per cut
evals_dir = "data/evals"

# Finding id prefix by agent zone. An agent id has the form "<zone>.<name>".
[finding_id_prefixes]
rbqm = "RBQM"
safety = "SAF"
quality = "QA"
preclinical = "PRE"
tmf = "TMF"
unblinded = "DSMB"

# Source of the CDISC pilot SDTM transport files.
[pilot]
base_url = "https://github.com/cdisc-org/sdtm-adam-pilot-project/raw/master/updated-pilot-submission-package/900172/m5/datasets/cdiscpilot01/tabulations/sdtm"
domains = ["dm", "ae", "vs", "lb", "ds", "sv", "ex"]
timeout_seconds = 120.0

# Operational data synthesis. Log-normal sigmas are on the natural log scale.
[ops_synth]
study_median_entry_lag_days = 3.0
site_median_lag_sigma = 0.5
entry_lag_sigma = 0.6
queries_per_subject_visit = 0.4
query_open_probability = 0.25
open_query_age_mean_days = 10.0
deviation_rate_mean = 0.15
deviation_rate_shape = 4.0
deviation_categories = [
    "informed_consent",
    "eligibility",
    "visit_window",
    "procedure_not_done",
    "lab_sample_handling",
    "concomitant_medication",
]
screen_failure_rate_mean = 0.3
screen_failure_concentration = 20.0

# Where agents run. openshell (the default): one OpenShell sandbox per run, from the agent
# image, with policies/<zone>.yaml. inprocess: in the runner's process; only when asked for
# (--executor inprocess), and never for an operational cut ([cuts] below).
[runtime]
executor = "openshell"
image = ""  # empty: meridian-agent:<package version>
exec_timeout_seconds = 120
keep_failed = false
policies_dir = "policies"
delete_workers = 4  # background deletion threads; 0 deletes synchronously
delete_confirm_seconds = 60.0  # until a deleted sandbox must be gone from sandbox list
sandboxes_log = "var/sandboxes.jsonl"
conformance_log_timeout_seconds = 30.0  # wait for the NET:OPEN DENIED line

# The model the narrator (rbqm.narrator) calls, through the OpenShell provider only.
[llm]
model = "claude-haiku-5-5"
max_tokens = 300
# temperature is left out: claude-haiku-5-5 answers HTTP 400 "`temperature` is deprecated
# for this model." Set it (for example temperature = 0.0) only for a model that accepts it.
disable_thinking = true  # sends thinking {type: disabled}; output stays within max_tokens
timeout_seconds = 30.0

# The local model (phase 3 step 3b): Ollama on the host, reached only from the
# safety.local_model sandbox (policies/safety.local_model.yaml). base_url must be the
# address and port in that policy. Calls are deterministic (temperature 0, a fixed seed,
# think false). A model is pinned by the digest /api/tags reports: a job refuses to run if
# Ollama serves a different one. The candidates were compared in docs/local-model-eval.md.
[local_model]
base_url = "http://172.17.0.1:11434"
model = "phi4-mini:3.8b-q4_K_M"  # chosen on the dev term pairs (docs/local-model-eval.md)
# safety.term_adjudicator 1.1.0: "yes" or "no" only when every model says so, else "unsure".
adjudicator_models = ["phi4-mini:3.8b-q4_K_M", "qwen3.5:4b-q4_K_M"]
num_ctx = 4096
seed = 20261109
temperature = 0.0
num_predict = 256
think = false
timeout_seconds = 120.0
max_calls_per_pass = 200
max_per_job = 16  # requests per sandbox: a long silent exec is cut by the gateway

[local_model.digests]
"granite4:3b" = "89962fcc75239ac434cdebceb6b7e0669397f92eaef9c487774b718bc36a3e5f"
"phi4-mini:3.8b-q4_K_M" = "78fad5d182a7c33065e153a5f8ba210754207ba9d91973f57dffa7f487363753"
"qwen3.5:4b-q4_K_M" = "d8b0f5e9760cd1682034f292d7ef72ec46f432149be0df7574bf2d6e92e38c04"


# rbqm.narrator: explains findings of rbqm.kri_monitor, rbqm.qtl_detector and rbqm.csm.
# It runs only in an OpenShell sandbox with policies/rbqm.narrator.yaml and the
# meridian-anthropic provider, and only after that policy passed meridian sandbox
# conformance --policy rbqm.narrator.
[narrator]
max_calls_per_pass = 20

# Cut scope. Operational cuts are the study's current data and the only ones the review
# queue shows by default; every other cut (null, faulted, holdout, sweep) is evaluation.
[cuts]
operational = ["DC-BASE"]
# Operational cuts are processed in OpenShell sandboxes only: the runner refuses the
# in-process executor for them (evaluation cuts may use either).
operational_executor = "openshell"

# The Fleet API (phase 3): `meridian api serve`. Binds to 127.0.0.1 only; identity is
# development-only (config/people.toml), not authentication.
[api]
port = 8765
people_file = "config/people.toml"
portfolio_file = "config/portfolio.toml"
openapi_file = "openapi/meridian-api.json"

# Phase 1 thresholds are frozen (commit "Freeze phase 1 thresholds before holdout").
# They were tuned only on DC-BASE, DC-RBQM-CORE and DC-NULL-S1 to S5; the defaults were
# kept (see docs/tuning-phase1.md). Do not change them in response to holdout or sweep results.
#
# Agents. enabled lists the agent ids the runner wakes; [agents.<name>] is each agent's
# own configuration and is all the agent ever sees.
[agents]
enabled = ["rbqm.kri_monitor", "rbqm.qtl_detector", "rbqm.csm", "safety.sae_reconciler"]

[agents.kri_monitor]
alpha = 0.01
lag_days = 7.0
query_age_days = 21.0
min_subjects = 5
min_open_queries = 5
# Expected-AE variant (meridian.stats.ae_expectation), chosen on the dev cuts by the
# pre-registered experiment in docs/ae-experiment.md and frozen (commit "Freeze AE
# expectation variant before holdout 2"): no variant beat a, so a is kept. Do not change
# it in response to holdout 2. W of the early_window variant, in treatment days.
ae_variant = "a"
early_window_days = 42

[agents.qtl_detector]
# Computed once from DC-BASE: premature discontinuation 144/254 = 0.5669 (base rate)
# plus margin 0.05 = 0.6169, rounded to 3 decimals. Do not recompute from later cuts.
discontinuation_limit = 0.617
# Approaching from limit - approach_band, breached from the limit.
approach_band = 0.02

[agents.csm]
# Between-site robust z of log SD; flag when z < -z_threshold and SD ratio < sd_ratio_max.
z_threshold = 3.5
sd_ratio_max = 0.6
min_subjects = 5
min_readings = 50
parameters = ["SYSBP", "DIABP", "PULSE"]

[agents.sae_reconciler]
# SAE reconciliation (1.0 in phase 3 step 3a, 1.1 in step 3a2), deterministic. Set before
# each evaluation in docs/safety-eval.md and not changed in response to it. Matching rule:
# docs/safety-notes.md. Outcome and causality terms: config/safety_terms.toml.
onset_tolerance_days = 1   # onsets more than 1 day apart are an onset mismatch
fallback_window_days = 7   # pairing window (1.1): same subject and term, within 7 days
cost_per_day = 1           # pairing cost per day between onsets
cost_outcome = 3           # pairing cost when the outcomes differ
cost_causality = 1         # pairing cost when the causalities differ
term_mismatch_days = 1     # recoded term: lone SAE and lone case within 1 day
late_after_hours = 24.0    # receipt more than 24 hours after site awareness is late
site_late_min = 2          # a site with 2 or more late cases gets a site-level finding
# Who may see which finding. Subject-level findings carry the subject id; the site-level
# finding (sae_late_reporting_site) carries no subject id and may also reach portfolio_lead.
subject_visible_to = ["clinical_ops_lead", "medical_monitor", "qa_auditor"]
site_visible_to = ["clinical_ops_lead", "medical_monitor", "qa_auditor", "portfolio_lead"]

[agents.tmf_completeness]
# quality.tmf_completeness 1.0.0 (phase 3 step 4a), deterministic. The expected artifacts,
# their milestones and timing rules are in config/tmf_expected.toml (docs/tmf-notes.md).
# Site milestones from DM: RFICDTC is empty for every pilot subject, so the first subject
# at a site is its earliest RFSTDTC and the last its latest RFENDTC.
first_subject_field = "RFSTDTC"
last_subject_field = "RFENDTC"
# No TMF finding carries subject data, so portfolio_lead may see them; not toxicologist,
# and not the unblinded statistician (as for every blinded finding today).
visible_to = ["clinical_ops_lead", "medical_monitor", "qa_auditor", "portfolio_lead"]
