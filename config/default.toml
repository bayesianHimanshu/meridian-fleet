# Meridian Agent Fleet default configuration.
# Every key can be overridden by an environment variable prefixed MERIDIAN_,
# for example MERIDIAN_LEDGER_PATH=/tmp/ledger.sqlite3.

ledger_path = "var/ledger.sqlite3"
default_seed = 20261107

study_id = "MRD-201"
raw_dir = "data/raw/cdisc_pilot"
curated_root = "data/curated"
sites_file = "config/sites.toml"
ground_truth_dir = "data/ground_truth"
safety_root = "data/safety_db"  # the synthetic safety database, one snapshot per cut
etmf_root = "data/etmf"  # the synthetic eTMF index, one snapshot per cut
audit_root = "var/audit"  # audit extracts of the ledger, one folder per review
evals_dir = "data/evals"

# Finding id prefix by agent zone. An agent id has the form "<zone>.<name>".
[finding_id_prefixes]
rbqm = "RBQM"
safety = "SAF"
quality = "QA"
preclinical = "PRE"
portfolio = "SIG"  # phase 5 step 3a: portfolio.safety_signal_scout's reporting signals
tmf = "TMF"
unblinded = "DSMB"
human = "OBS"  # QA observations: raised by a person (agent id "human.observation")

# Source of the CDISC pilot SDTM transport files.
[pilot]
base_url = "https://github.com/cdisc-org/sdtm-adam-pilot-project/raw/master/updated-pilot-submission-package/900172/m5/datasets/cdiscpilot01/tabulations/sdtm"
domains = ["dm", "ae", "vs", "lb", "ds", "sv", "ex"]
timeout_seconds = 120.0

# MRD-101's GLP rat study: PointCross PC201708 (PHUSE phuse-scripts, MIT), relabelled.
# docs/preclinical-data.md. Each file's sha256 is pinned; fetch and ingest refuse others.
[preclinical]
asset_id = "MRD-101"
study_id = "MRD-101-TOX-01"
cut_id = "TOX-FINAL"
treatment = "MRD-101"
source_study_id = "PC201708"
source_treatment = "PCDRUG"
base_url = "https://raw.githubusercontent.com/phuse-org/phuse-scripts/398a6d33ced9359ffb58c46650a6d488811176b1/data/send/PointCross"
raw_dir = "data/raw/send_pointcross"
send_root = "data/send"
timeout_seconds = 120.0

[preclinical.files]
bg = "b8f4fd8d24c45ce802b3d65002d7f9eb113abb81765ed5f8a2e429e58f38ca04"
bw = "dbd48fc10a754275b9d7036687134ba0a1f96aa87b22d650f45c6bcbf3da33b2"
cl = "84a9bf432fd74b483d4802af1f7328fc6554caeecd5790bf31dd57398377e8ed"
dd = "f58b21e4988dbafe67561be62cd8cda8286c132b4cff6e18567d48420f5e9f2b"
dm = "ab5d342a5ae13d3b8613fc318d319f7ea642a4caa8bd8e360f080dda383b341f"
ds = "b6a616bc71c02cc91b7b649778d472b0eedb5d702a280fd8639d0706bc74e0dd"
ex = "3a121adbd8f8434b796f31c3a3cd81a645911acd9f080c1974954657fc942cb0"
fw = "6bc43499ed5d47277c36275062ab7310868947a356b54037473cd4c60e51e7ab"
