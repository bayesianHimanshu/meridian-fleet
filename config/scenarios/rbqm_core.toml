# RBQM core fault scenario. Generated once from DC-BASE; always read from this file afterwards.
#
# Target sites: sites ranked by treated subjects (RFSTDTC not blank), descending,
# ties broken by site id ascending. Rank 1 gets fabricated_vitals, rank 2
# ae_under_reporting, rank 3 entry_lag_spike, rank 4 query_backlog, rank 5
# deviation_cluster. Every target needs at least 10 treated subjects.
# Top of the ranking (site, treated): 1001 (41), 1010 (31), 1004 (25), 1008 (25), 1016 (24), 1009 (21), 1003 (18), 1005 (16).
#
# target_rate: DC-BASE premature discontinuation rate 144/254 = 0.5669, plus 0.10,
# rounded to 3 decimals.

seed = 20261107
base_cut = "DC-BASE"
out_cut = "DC-RBQM-CORE"

[[faults]]
