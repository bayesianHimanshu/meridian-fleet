# OpenShell 0.1.7 provider profile for the rbqm.narrator agent. No secrets in this file.
#
# The provider created from it holds the real ANTHROPIC_API_KEY on the gateway. Inside a
# sandbox the variable holds a placeholder; the policy proxy terminates TLS (the sandbox
# trusts the supervisor CA through SSL_CERT_FILE), checks method and path, and writes the
# real key into the x-api-key header only on these two requests to api.anthropic.com:443,
# and only from the image's interpreter. The proxy names a binary by its real path, so
# this is /usr/local/bin/python3.14, the target of the venv's /opt/meridian/venv/bin/python.
id: meridian-anthropic
display_name: Anthropic (Meridian narrator)
description: Anthropic Messages API for the rbqm.narrator agent
category: inference
credentials:
  - name: api_key
    description: Anthropic API key
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: POST
          path: /v1/messages
      - allow:
          method: GET
          path: /v1/models
binaries:
  - /usr/local/bin/python3.14
